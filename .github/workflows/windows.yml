name: Windows VST3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check the plugin
        run: cargo check --workspace --locked
      - name: Run focused checks
        run: cargo test --workspace --locked -- --test-threads=1
      - name: Build the Windows x64 VST3 bundle
        run: cargo xtask bundle rustel-vst3 --release --locked
      - name: Fetch the pinned upstream Rustel source
        shell: pwsh
        run: |
          $revision = (Get-Content rustel-cli-revision.txt -Raw).Trim()
          if ($revision -notmatch '^[0-9a-f]{40}$') {
            throw "rustel-cli-revision.txt must contain a full Git commit hash."
          }
          git init rustel-cli-source
          git -C rustel-cli-source remote add origin https://github.com/tzfm/rustel.git
          git -C rustel-cli-source fetch --depth 1 origin $revision
          git -C rustel-cli-source checkout --detach FETCH_HEAD
          $resolved = (git -C rustel-cli-source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $resolved -ne $revision) {
            throw "The checked-out Rustel CLI source does not match the pinned revision."
          }
      - name: Prepare Windows-only upstream dependency resolution
        shell: pwsh
        run: |
          git apply --directory=rustel-cli-source scripts/windows-cli-pulseaudio.patch
          cargo update --manifest-path rustel-cli-source/Cargo.toml --package pulseaudio --precise 0.3.2
      - name: Build the full Windows command-line app
        run: cargo build --manifest-path rustel-cli-source/Cargo.toml --package rustel --release --locked
      - name: Fetch and verify the supported Csound runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "Csound-6.18.1-windows-x64-binaries.zip"
          $url = "https://github.com/csound/csound/releases/download/6.18.1/Csound-6.18.1-windows-x64-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = "bd499ac6f476d98c6ae951a8fbfda365e594ef34bcf480c5a273281df940c220"
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "The official Csound 6.18.1 archive failed its SHA-256 check."
          }
          $extract = Join-Path $env:RUNNER_TEMP "csound-6.18.1"
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $runtime = Join-Path $extract "build/Release"
          foreach ($required in @("csound64.dll", "stdutil.dll")) {
            if (!(Test-Path (Join-Path $runtime $required))) {
              throw "Csound runtime file is missing: $required"
            }
          }
          "CSOUND_RUNTIME=$runtime" >> $env:GITHUB_ENV
          $copying = Join-Path $env:RUNNER_TEMP "CSOUND-COPYING"
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/csound/csound/6.18.1/COPYING" `
            -OutFile $copying
          "CSOUND_COPYING=$copying" >> $env:GITHUB_ENV
      - name: Assemble download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item -Recurse target/bundled/Rustel.vst3 package/
          Copy-Item rustel-cli-source/target/release/rustel.exe package/
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md, rustel-cli-revision.txt package/
          Copy-Item -Recurse licenses package/
          Copy-Item scripts/install-windows.ps1 package/
          Copy-Item rustel-cli-source/LICENSE package/licenses/RUSTEL-CLI-LICENSE
          Copy-Item rustel-cli-source/NOTICE.md package/licenses/RUSTEL-CLI-NOTICE.md
          New-Item -ItemType Directory -Force package/CsoundRuntime | Out-Null
          Get-ChildItem $env:CSOUND_RUNTIME -Filter *.dll |
            Copy-Item -Destination package/CsoundRuntime
          Copy-Item $env:CSOUND_COPYING package/licenses/CSOUND-COPYING
          Copy-Item licenses/CSOUND-RUNTIME-NOTICE.md package/
          $sourceFiles = Get-ChildItem rustel-cli-source -Force |
            Where-Object { $_.Name -notin @(".git", "target") }
          Compress-Archive -Path $sourceFiles.FullName -DestinationPath package/Rustel-CLI-Source.zip
          if (!(Test-Path package/Rustel.vst3/Contents/x86_64-win/Rustel.vst3)) {
            throw "The Windows VST3 binary is missing."
          }
          if (!(Test-Path package/rustel.exe)) {
            throw "The Windows Rustel CLI binary is missing."
          }
          if (!(Test-Path package/Rustel-CLI-Source.zip)) {
            throw "The Rustel CLI source archive is missing."
          }
          if (!(Test-Path package/CsoundRuntime/csound64.dll) -or
              !(Test-Path package/CsoundRuntime/stdutil.dll) -or
              !(Test-Path package/licenses/CSOUND-COPYING)) {
            throw "The bundled Csound runtime or its license is missing."
          }
      - name: Install and smoke-test the Windows package
        shell: pwsh
        run: |
          ./scripts/install-windows.ps1 -Bundle "$PWD/package/Rustel.vst3" `
            -CsoundRuntime "$PWD/package/CsoundRuntime" `
            -Destination "$env:RUNNER_TEMP/rustel-vst3-test" `
            -CsoundDestination "$env:RUNNER_TEMP/rustel-csound-test"
          if (!(Test-Path "$env:RUNNER_TEMP/rustel-vst3-test/Rustel.vst3/Contents/x86_64-win/Rustel.vst3") -or
              !(Test-Path "$env:RUNNER_TEMP/rustel-csound-test/csound64.dll")) {
            throw "The bundled installer did not install the plugin and Csound runtime."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Rustel-Windows-x64
          path: package/
          if-no-files-found: error
          retention-days: 14

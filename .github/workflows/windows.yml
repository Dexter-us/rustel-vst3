name: Windows VST3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check the plugin
        run: cargo check --workspace --locked
      - name: Run focused checks
        run: cargo test --workspace --locked -- --test-threads=1
      - name: Build the uniquely selected plugin library
        run: cargo build --package rustel-vst3@0.1.15 --release --locked
      - name: Prepare the NIH bundler library path
        shell: pwsh
        run: |
          Copy-Item target/release/rustel_vst3.dll `
            'target/release/rustel_vst3@0.1.15.dll' -Force
      - name: Build the Windows x64 VST3 bundle
        run: cargo xtask bundle rustel-vst3@0.1.15 --release --locked
      - name: Build the VST3 scan helper
        run: cargo build --package rustel-vst3@0.1.15 --bin rustel-vst-worker --release --locked
      - name: Configure the MIDI VST3 host helper
        run: cmake -S midi-host -B midi-host/build -A x64
      - name: Build the MIDI VST3 host helper
        run: cmake --build midi-host/build --config Release --parallel
      - name: Verify the scan helper does not open a console
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("target/release/rustel-vst-worker.exe")
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($subsystem -ne 2) {
            throw "The VST scan helper must use the Windows GUI subsystem, not open a console."
          }
      - name: Place the scan helper beside the plugin
        shell: pwsh
        run: |
          Copy-Item target/release/rustel-vst-worker.exe `
            target/bundled/RustelVstWorker.exe
      - name: Place the MIDI host helper beside the plugin
        shell: pwsh
        run: |
          $helper = Get-ChildItem midi-host/build -Filter "*.exe" -Recurse |
            Where-Object {
              $_.FullName -match "[\\/]MidiVst3CaptureHost_artefacts[\\/]Release[\\/]"
            } |
            Select-Object -First 1
          if (!$helper) {
            throw "The MIDI VST3 host helper executable was not built."
          }
          Copy-Item $helper.FullName target/bundled/RustelMidiHost.exe -Force
          $bytes = [IO.File]::ReadAllBytes("target/bundled/RustelMidiHost.exe")
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($subsystem -ne 2) {
            throw "The MIDI host helper must use the Windows GUI subsystem, not open a console."
          }
      - name: Fetch the pinned upstream Rustel source
        shell: pwsh
        run: |
          $revision = (Get-Content rustel-cli-revision.txt -Raw).Trim()
          if ($revision -notmatch '^[0-9a-f]{40}$') {
            throw "rustel-cli-revision.txt must contain a full Git commit hash."
          }
          git init rustel-cli-source
          git -C rustel-cli-source remote add origin https://github.com/tzfm/rustel.git
          git -C rustel-cli-source fetch --depth 1 origin $revision
          git -C rustel-cli-source checkout --detach FETCH_HEAD
          $resolved = (git -C rustel-cli-source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $resolved -ne $revision) {
            throw "The checked-out Rustel CLI source does not match the pinned revision."
          }
      - name: Prepare Windows-only upstream dependency resolution
        shell: pwsh
        run: |
          git apply --directory=rustel-cli-source scripts/windows-cli-pulseaudio.patch
          cargo update --manifest-path rustel-cli-source/Cargo.toml --package pulseaudio --precise 0.3.2
      - name: Build the full Windows command-line app
        run: cargo build --manifest-path rustel-cli-source/Cargo.toml --package rustel --release --locked
      - name: Fetch and verify the supported Csound runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "Csound-6.18.1-windows-x64-binaries.zip"
          $url = "https://github.com/csound/csound/releases/download/6.18.1/Csound-6.18.1-windows-x64-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = "bd499ac6f476d98c6ae951a8fbfda365e594ef34bcf480c5a273281df940c220"
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "The official Csound 6.18.1 archive failed its SHA-256 check."
          }
          $extract = Join-Path $env:RUNNER_TEMP "csound-6.18.1"
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $runtime = Join-Path $extract "build/Release"
          foreach ($required in @("csound64.dll", "stdutil.dll")) {
            if (!(Test-Path (Join-Path $runtime $required))) {
              throw "Csound runtime file is missing: $required"
            }
          }
          "CSOUND_RUNTIME=$runtime" >> $env:GITHUB_ENV
          $copying = Join-Path $env:RUNNER_TEMP "CSOUND-COPYING"
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/csound/csound/6.18.1/COPYING" `
            -OutFile $copying
          "CSOUND_COPYING=$copying" >> $env:GITHUB_ENV
      - name: Validate FM examples with Csound 6.18.1
        shell: pwsh
        run: |
          $csound = Join-Path $env:CSOUND_RUNTIME "csound.exe"
          if (!(Test-Path $csound)) {
            throw "The Csound 6.18.1 command-line syntax checker is missing."
          }
          $env:OPCODE6DIR64 = $env:CSOUND_RUNTIME
          $examples = @(
            @{ Instrument = "fm_electric_piano"; Orchestra = "Scores/fm-electric-piano.orc" },
            @{ Instrument = "fm_bass"; Orchestra = "Scores/fm-bass.orc" },
            @{ Instrument = "fm_bell"; Orchestra = "Scores/fm-bell.orc" }
          )
          foreach ($example in $examples) {
            if (!(Test-Path $example.Orchestra)) {
              throw "Missing Csound orchestra: $($example.Orchestra)"
            }
            $score = Join-Path $env:RUNNER_TEMP "$($example.Instrument).sco"
            $scoreText = "i `"$($example.Instrument)`" 0 0.25 60 100`ne`n"
            [IO.File]::WriteAllText($score, $scoreText, [Text.Encoding]::ASCII)
            & $csound -n -d -m0 --syntax-check-only $example.Orchestra $score
            if ($LASTEXITCODE -ne 0) {
              throw "Csound 6.18.1 rejected $($example.Orchestra)."
            }
          }
      - name: Assemble download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item -Recurse target/bundled/Rustel.vst3 package/
          Copy-Item rustel-cli-source/target/release/rustel.exe package/
          Copy-Item target/bundled/RustelVstWorker.exe package/
          Copy-Item target/bundled/RustelMidiHost.exe package/
          Copy-Item README.md, Rustel-Help.html, LICENSE, THIRD_PARTY_NOTICES.md, rustel-cli-revision.txt package/
          Copy-Item -Recurse licenses package/
          Copy-Item scripts/install-windows.ps1 package/
          Copy-Item rustel-cli-source/LICENSE package/licenses/RUSTEL-CLI-LICENSE
          Copy-Item rustel-cli-source/NOTICE.md package/licenses/RUSTEL-CLI-NOTICE.md
          Copy-Item -Recurse Scores package/
          New-Item -ItemType Directory -Force package/CsoundRuntime | Out-Null
          Get-ChildItem $env:CSOUND_RUNTIME -Filter *.dll |
            Copy-Item -Destination package/CsoundRuntime
          Copy-Item $env:CSOUND_COPYING package/licenses/CSOUND-COPYING
          Copy-Item licenses/CSOUND-RUNTIME-NOTICE.md package/
          $sourceFiles = Get-ChildItem rustel-cli-source -Force |
            Where-Object { $_.Name -notin @(".git", "target") }
          Compress-Archive -Path $sourceFiles.FullName -DestinationPath package/Rustel-CLI-Source.zip
          if (!(Test-Path package/Rustel.vst3/Contents/x86_64-win/Rustel.vst3)) {
            throw "The Windows VST3 binary is missing."
          }
          if (!(Test-Path package/rustel.exe)) {
            throw "The Windows Rustel CLI binary is missing."
          }
          if (!(Test-Path package/RustelVstWorker.exe)) {
            throw "The Rustel VST3 scan helper is missing."
          }
          if (!(Test-Path package/RustelMidiHost.exe)) {
            throw "The Rustel MIDI VST3 host helper is missing."
          }
          if (!(Test-Path package/Rustel-CLI-Source.zip)) {
            throw "The Rustel CLI source archive is missing."
          }
          if (!(Test-Path package/Rustel-Help.html)) {
            throw "The Rustel HTML help file is missing."
          }
          if (!(Test-Path package/CsoundRuntime/csound64.dll) -or
              !(Test-Path package/CsoundRuntime/stdutil.dll) -or
              !(Test-Path package/licenses/CSOUND-COPYING)) {
            throw "The bundled Csound runtime or its license is missing."
          }
          $portable = Join-Path $env:RUNNER_TEMP "rustel-portable"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Get-ChildItem package -Force |
            Where-Object { $_.Name -ne "install-windows.ps1" } |
            Copy-Item -Destination $portable -Recurse
          Copy-Item PORTABLE-WINDOWS.txt "$portable/README-PORTABLE.txt"
          Compress-Archive -Path "$portable/*" `
            -DestinationPath package/Rustel-Windows-x64-Portable.zip
          $portableTest = Join-Path $env:RUNNER_TEMP "rustel-portable-test"
          Expand-Archive package/Rustel-Windows-x64-Portable.zip `
            -DestinationPath $portableTest -Force
          foreach ($required in @(
            "Rustel.vst3/Contents/x86_64-win/Rustel.vst3",
            "rustel.exe",
            "RustelVstWorker.exe",
            "RustelMidiHost.exe",
            "Scores/fm-electric-piano.orc",
            "Scores/fm-electric-piano.strudel",
            "Scores/fm-bass.orc",
            "Scores/fm-bass.strudel",
            "Scores/fm-bell.orc",
            "Scores/fm-bell.strudel",
            "CsoundRuntime/csound64.dll",
            "licenses/CSOUND-COPYING",
            "README-PORTABLE.txt",
            "Rustel-Help.html"
          )) {
            if (!(Test-Path (Join-Path $portableTest $required))) {
              throw "Portable ZIP is missing '$required'."
            }
          }
          if (Test-Path (Join-Path $portableTest "install-windows.ps1")) {
            throw "Portable ZIP must not contain the installer."
          }
      - name: Install and smoke-test the Windows package
        shell: pwsh
        run: |
          ./package/install-windows.ps1 -Bundle "$PWD/package/Rustel.vst3" `
            -CsoundRuntime "$PWD/package/CsoundRuntime" `
            -Destination "$env:RUNNER_TEMP/rustel-vst3-test" `
            -CsoundDestination "$env:RUNNER_TEMP/rustel-csound-test"
          if (!(Test-Path "$env:RUNNER_TEMP/rustel-vst3-test/Rustel.vst3/Contents/x86_64-win/Rustel.vst3") -or
              !(Test-Path "$env:RUNNER_TEMP/rustel-vst3-test/RustelVstWorker.exe") -or
              !(Test-Path "$env:RUNNER_TEMP/rustel-vst3-test/RustelMidiHost.exe") -or
              !(Test-Path "$env:RUNNER_TEMP/rustel-csound-test/csound64.dll")) {
            throw "The bundled installer did not install the plugin and Csound runtime."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Rustel-Windows-x64
          path: package/
          if-no-files-found: error
          retention-days: 14

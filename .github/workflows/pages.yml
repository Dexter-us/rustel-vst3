name: Publish Rustel Help

on:
  push:
    branches: [main]
    paths:
      - Rustel-Help.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare the help site
        run: |
          mkdir -p _site
          cp Rustel-Help.html _site/index.html
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish the help page
        id: deployment
        uses: actions/deploy-pages@v4
